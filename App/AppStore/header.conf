# Product page header: three iPhones fanned over the icon's night sky and red horizon.
# Render with appstore-kit: ../appstore-kit/render-header.sh App/AppStore
background='radial-gradient(ellipse 55% 75% at 50% 30%, #1c2c4a 0%, #0a1424 55%, #05080f 100%)'
left=04-3d
center=01-sky
right=08-jupiter
extra_css='
  body::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(200 * var(--u)); background: #05080f; border-top: calc(10 * var(--u)) solid #e03d30; z-index: 3;
  }
  .iphone { box-shadow: 0 0 0 calc(4 * var(--u)) rgba(255, 255, 255, 0.14), 0 calc(50 * var(--u)) calc(120 * var(--u)) rgba(0, 0, 0, 0.6); }'
