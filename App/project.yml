name: Moonrise
options:
  bundleIdPrefix: sh.krz
  deploymentTarget:
    iOS: "26.0"
packages:
  MoonriseKit:
    path: ../Packages/MoonriseKit
targets:
  Moonrise:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: MoonriseKit
        product: SkyEngine
      - package: MoonriseKit
        product: SkyRenderer
      - package: MoonriseKit
        product: Feeds
    entitlements:
      path: Sources/Moonrise.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moonrise
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Moonrise uses your location to draw the sky above you.
