name: Moonrise
options:
  bundleIdPrefix: sh.krz
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
    visionOS: "26.0"
packages:
  MoonriseKit:
    path: ../Packages/MoonriseKit
targets:
  Moonrise:
    type: application
    platform: iOS
    scheme:
      testTargets: [MoonriseUITests]
    sources:
      - Sources
      - Shared
      - path: Globes
        type: folder
    dependencies:
      - package: MoonriseKit
        product: SkyEngine
      - package: MoonriseKit
        product: SkyRenderer
      - package: MoonriseKit
        product: Feeds
      - package: MoonriseKit
        product: Library
      - package: MoonriseKit
        product: ObservingLog
      - package: MoonriseKit
        product: Answers
      - target: MoonriseWidgets
      - target: MoonriseWatch
    entitlements:
      path: Sources/Moonrise.entitlements
      properties:
        aps-environment: development
        com.apple.developer.weatherkit: true
    info:
      path: Sources/Info.plist
      properties:
        MoonriseAPIURL: $(MOONRISE_API_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      configs:
        Debug:
          MOONRISE_API_URL: https://moonrise.krz.sh
        Release:
          MOONRISE_API_URL: https://moonrise.krz.sh
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "52"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moonrise
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Moonrise uses your location to draw the sky above you.
  MoonriseWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: MoonriseKit
        product: SkyEngine
      - package: MoonriseKit
        product: SkyRenderer
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Moonrise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise.widgets
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "52"
  MoonriseWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    dependencies:
      - package: MoonriseKit
        product: SkyEngine
      - package: MoonriseKit
        product: SkyRenderer
      - target: MoonriseWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise.watchkitapp
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "52"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moonrise
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: sh.krz.moonrise
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Moonrise uses your location to work out tonight's sky.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MoonriseWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - Widgets/MoonriseWidgets.swift
    dependencies:
      - package: MoonriseKit
        product: SkyEngine
      - package: MoonriseKit
        product: SkyRenderer
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Watch/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Moonrise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise.watchkitapp.widgets
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "52"
  MoonriseVision:
    type: application
    platform: visionOS
    sources:
      - Vision
      - Sources/GlobeView.swift
      - Sources/GlobeMaps.swift
      - Sources/ColorHex.swift
      - path: Globes
        type: folder
    dependencies:
      - package: MoonriseKit
        product: SkyEngine
      - package: MoonriseKit
        product: SkyRenderer
      - package: MoonriseKit
        product: Library
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise.vision
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "52"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moonrise
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  MoonriseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Moonrise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise.uitests
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
