name: Moonrise
options:
  bundleIdPrefix: sh.krz
  deploymentTarget:
    iOS: "26.0"
packages:
  MoonriseKit:
    path: ../Packages/MoonriseKit
targets:
  Moonrise:
    type: application
    platform: iOS
    scheme:
      testTargets: [MoonriseUITests]
    sources: [Sources, Shared]
    dependencies:
      - package: MoonriseKit
        product: SkyEngine
      - package: MoonriseKit
        product: SkyRenderer
      - package: MoonriseKit
        product: Feeds
      - package: MoonriseKit
        product: Library
      - package: MoonriseKit
        product: ObservingLog
      - target: MoonriseWidgets
    entitlements:
      path: Sources/Moonrise.entitlements
      properties:
        aps-environment: development
    info:
      path: Sources/Info.plist
      properties:
        MoonriseAPIURL: $(MOONRISE_API_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      configs:
        Debug:
          MOONRISE_API_URL: https://moonrise-server.audit-labs.workers.dev
        Release:
          MOONRISE_API_URL: https://moonrise-server.audit-labs.workers.dev
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moonrise
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Moonrise uses your location to draw the sky above you.
  MoonriseWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: MoonriseKit
        product: SkyEngine
      - package: MoonriseKit
        product: SkyRenderer
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Moonrise
        NSWidgetWantsLocation: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise.widgets
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  MoonriseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Moonrise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.krz.moonrise.uitests
        DEVELOPMENT_TEAM: ZCNAX3VL9D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
